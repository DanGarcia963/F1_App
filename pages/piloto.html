<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Información del Piloto</title>
  
  <link href="styles/style.css" rel="stylesheet">
  <style>
    .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(6px); }
    .card-img { background-size: cover; background-position: center; }
      #gridVictories{
    max-height: 250px;
  }
  #gridPodios, #gridTrayectoria{
        max-height: 250px;
  }
    .scrollbar-hide {
      scrollbar-width: none; /* Firefox */
    }

    .scrollbar-hide::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .scuderia-content img {
        max-width: 80%;
        max-height: 120px;
        width: auto;
        height: auto;
        object-fit: cover;
        margin-bottom: 0.5rem;
      }

      .scuderia-content p {
        font-size: 1.1rem;
        word-break: break-word;
        text-align: center;
        margin: 0;
        padding: 0 0.5rem;
      }

      /* Responsive para cards pequeñas */
      @media (max-width: 500px) {
        .scuderia-content img {
          max-width: 60%;
          max-height: 70px;
        }
        .scuderia-content p {
          font-size: 0.95rem;
        }
      }

      .scuderia-content {
        position: absolute;
        top: -100%;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(20,20,20,0.92);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all .5s;
        pointer-events: none;
        z-index: 10;
      }

      .group:hover .scuderia-content {
        top: 0;
        opacity: 1;
        pointer-events: auto;
      }

    /* Mostrar scrollbar solo al hacer hover */
    .hover\\:scrollbar-default:hover {
      scrollbar-width: auto; /* Firefox */
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar-thumb {
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 4px;
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar-track {
      background-color: transparent;
    }
  </style>
</head>
<body class="bg-neutral-950 text-white min-h-screen items-center p-6">
  <div class="driver-page-grid">
  
    <!-- Contenedor principal -->
  <section class="driver-panel driver-profile-panel">
    <!-- Foto del piloto -->
    <div class="flex-shrink-0 flex flex-col items-center">
      <span id="fotoPiloto"></span>
      <p id="nombrePiloto" class="mt-4 text-xl font-bold"></p>
      <p id="equipoPiloto" class="text-neutral-400"></p>
    </div>
    <!-- Informacion y rendimiento en tarjetas de anchura adaptable -->
    <div class="driver-overview">
      <div id="infoGridDetalles" class="driver-section-heading">
        <h2>Datos del piloto</h2>
      </div>
      <dl class="driver-meta-grid">
        <div><dt>Nacionalidad</dt><dd id="nacionalidadPiloto">—</dd></div>
        <div><dt>Nacimiento</dt><dd id="fechaNacimiento">—</dd></div>
        <div><dt>Dorsal / Código FIA</dt><dd id="numeroPiloto">—</dd></div>
      </dl>
      <h3 class="driver-stats-heading">Estadísticas de carrera</h3>
      <div class="driver-stats-grid">
        <div class="driver-stat-card driver-stat-card--primary">
          <span class="driver-stat-label">Puntos acumulados</span>
          <strong id="puntosTotales" class="driver-stat-value">0</strong>
          <span id="puntosPromedio" class="driver-stat-note">0 pts / carrera</span>
        </div>
        <div class="driver-stat-card">
          <span class="driver-stat-label">Grandes Premios</span>
          <strong id="startsPiloto" class="driver-stat-value">0</strong>
          <span class="driver-stat-note">Participaciones</span>
        </div>
        <div class="driver-stat-card">
          <span class="driver-stat-label">Victorias</span>
          <strong id="victoriasPiloto" class="driver-stat-value">0</strong>
          <span id="victoriasPct" class="driver-stat-note">0%</span>
        </div>
        <div class="driver-stat-card">
          <span class="driver-stat-label">Podios</span>
          <strong id="podiosPiloto" class="driver-stat-value">0</strong>
          <span id="podiosPct" class="driver-stat-note">0%</span>
        </div>
        <div class="driver-stat-card">
          <span class="driver-stat-label">Pole positions</span>
          <strong id="polesPiloto" class="driver-stat-value">0</strong>
          <span id="polesPct" class="driver-stat-note">0%</span>
        </div>
        <div class="driver-stat-card">
          <span class="driver-stat-label">Vueltas rápidas</span>
          <strong id="fastLapsPiloto" class="driver-stat-value">0</strong>
          <span id="fastLapsPct" class="driver-stat-note">0%</span>
        </div>
      </div>
    </div>
  </section>

  <section class="driver-panel driver-victories-panel">
    <div id="infoGridVictorias" class="grid grid-cols-1 gap-4 p-4 items-start">
      <div class="group bg-neutral-900 rounded-xl overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer">
        <div class="p-4 flex flex-row items-center gap-4">
          <div class="flex flex-col">
            <p class="text-2xl max-w-full text-neutral-200 font-semibold">Victorias</p>
          </div>
        </div>
      </div>
    </div>
    <div id="gridVictories" 
      class="flex lg:grid lg:grid-cols-3 xl:grid-cols-3 2xl:grid-cols-4 gap-6 p-6 max-w-full items-stretch
      overflow-x-auto lg:overflow-x-visible 
      overflow-y-hidden lg:overflow-y-auto 
      scroll-smooth scrollbar-thin scrollbar-thumb-red-700 scrollbar-track-red-900 scrollbar-hide hover:scrollbar-default">
    </div>
  </section>

  <section class="driver-panel driver-career-panel">
    <div id="infoGridTrayectoria" class="grid grid-cols-1 gap-4 p-4 items-start">
      <div class="group bg-neutral-900 rounded-xl overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer">
        <div class="p-4 flex flex-row items-center gap-4">
          <div class="flex flex-col">
            <p class="text-2xl max-w-full text-neutral-200 font-semibold">Trayectoria</p>

    </div>

      class="flex gap-4 p-4 max-w-full items-stretch

      scroll-smooth scrollbar-thin scrollbar-thumb-red-700 scrollbar-track-red-900 scrollbar-hide hover:scrollbar-default">

  <section class="driver-panel driver-podiums-panel">
    <div id="infoGridPodios" class="grid grid-cols-1 gap-4 p-4 items-start">
      <div class="group bg-neutral-900 rounded-xl overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer">
        <div class="p-4 flex flex-row items-center gap-4">
          <div class="flex flex-col">
            <p class="text-2xl max-w-full text-neutral-200 font-semibold">Podios</p>
          </div>
        </div>
      </div>
    </div>
    <div id="gridPodios" 
      class="flex gap-4 p-4 max-w-full items-stretch 
      overflow-x-visible 
      overflow-y-auto 
      scroll-smooth scrollbar-thin scrollbar-thumb-red-700 scrollbar-track-red-900 scrollbar-hide hover:scrollbar-default">
    </div>
  </section>

</div>
  <!-- Script para cargar datos -->
  <script>

    async function obtenerFotoPiloto(nombrePiloto) {
  // Normaliza el nombre para que coincida con la carpeta
  const nombreCarpeta = nombrePiloto.trim();
  const extensiones = ['jpg', 'png', 'jpeg', 'webp','avif'];
  for (let ext of extensiones) {
    const urlLocal = `/Driver_photos/${encodeURIComponent(nombreCarpeta)}/driver.${ext}`;
    try {
      const res = await fetch(urlLocal, { method: 'HEAD' });
      if (res.ok) return urlLocal;
    } catch (e) { /* ignorar */ }
  }
  // Si no hay foto local, busca en Wikipedia
  return await obtenerImagenWikipedia(nombrePiloto);
}

    async function obtenerImagenWikipedia(nombre) {
      const query = encodeURIComponent(nombre);
      const url = `https://en.wikipedia.org/w/api.php?action=query&titles=${query}&prop=pageimages&format=json&pithumbsize=1000&origin=*`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const pages = data.query.pages;
        const page = Object.values(pages)[0];
        return page.thumbnail ? page.thumbnail.source : null;
      } catch (err) {
        console.error('Error obteniendo imagen de', nombre, err);
        return null;
      }
    }

    async function obtenerFotoEquipo(nombreEquipo) {
      // Normaliza el nombre para que coincida con la carpeta
      const nombreImagen = nombreEquipo.trim();
      const extensiones = ['png'];
      for (let ext of extensiones) {
        const urlLocal = `/Team_photos/${encodeURIComponent(nombreImagen)}.${ext}`;
        try {
          const res = await fetch(urlLocal, { method: 'HEAD' });
          if (res.ok) return urlLocal;
        } catch (e) { /* ignorar */ }
      }
      // Si no hay foto local, busca en Wikipedia
      //return await obtenerImagenWikipedia(nombreEquipo);
    }

    // Obtiene el id del piloto desde la URL
    const params = new URLSearchParams(window.location.search);
    const idPiloto = params.get("id");
    console.log(idPiloto)

    const formatHistoricDate = value => {
      const match=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(!match)return 'Fecha no registrada';
      return new Intl.DateTimeFormat('es-MX',{day:'numeric',month:'short',
        year:'numeric',timeZone:'UTC'})
        .format(new Date(match[1]+'-'+match[2]+'-'+match[3]+'T12:00:00Z'));
    };
    const circuitPhotoCache=new Map();
    function loadCircuitPhoto(name,card){
      if(!name)return;
      if(!circuitPhotoCache.has(name))
        circuitPhotoCache.set(name,obtenerImagenWikipedia(name).catch(()=>null));
      circuitPhotoCache.get(name).then(url=>{
        if(!url)return;
        const img=document.createElement('img');
        img.src=url;img.alt='Circuito '+name;
        img.loading='lazy';img.decoding='async';img.className='driver-race-thumb';
        img.onerror=()=>img.remove();
        const content=card.firstElementChild;
        if(content)content.insertBefore(img,content.querySelector('p'));
      });
    }

    async function cargarVictoriasPiloto(){
      try{
        const VictoriasPiloto = await fetch(`/api/piloto/obtenerVictoriasPiloto/${idPiloto}`).then(r=>r.json());
        const container =document.getElementById('gridVictories')
        container.innerHTML='';
        for(let i=0; i<VictoriasPiloto.length;i++){
        const victory = VictoriasPiloto[i];
        const imgCURL = null; // Foto opcional y asíncrona.
        const card = document.createElement('div');

        const newDate = formatHistoricDate(victory.fecha);

        card.className = 'group bg-neutral-900 rounded-xl flex-none min-w-[100px] overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer relative flex items-center justify-between';
        card.innerHTML =`                
                <div class="p-4 flex flex-col items-center text-center">
                <h3 class="text-lg font-bold text-white">${victory.nombre_oficial}</h3>
                ${imgCURL ? `<img src="${imgCURL}" alt="Bandera ${victory.nombre_Circuito}" class="w-40 h-35 mb-2 border bg-white">` : ''}
                <p class="text-sm text-neutral-400">${newDate}</p>
                </div>
                `;
                container.appendChild(card)
                loadCircuitPhoto(victory.nombre_Circuito,card)
      };
    }      
    catch (err) {
        console.error('Error cargando victorias', err);
    }
    }

    async function cargarPodiosPiloto(){
      try{
        const PodiosPiloto = await fetch(`/api/piloto/obtenerPodiosPiloto/${idPiloto}`).then(r=>r.json());
        const container =document.getElementById('gridPodios')
        container.innerHTML='';
        for(let i=0; i<PodiosPiloto.length;i++){
        const podios = PodiosPiloto[i];
        const imgCURL = null; // Foto opcional y asíncrona.
        const card = document.createElement('div');

        const newDate = formatHistoricDate(podios.Fecha);

        card.className = 'group bg-neutral-900 rounded-xl flex-none min-w-[100px] overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer relative flex items-center justify-between';
        card.innerHTML =`                
                <div class="p-4 flex flex-col items-center text-center">
                <h3 class="text-lg font-bold text-white">${podios.Nombre_GP}</h3>
                ${imgCURL ? `<img src="${imgCURL}" alt="Bandera ${podios.nombre_Circuito}" class="w-40 h-35 mb-2 border bg-white">` : ''}
                <p class="text-sm text-neutral-400">${newDate}</p>
                </div>
                `;
                container.appendChild(card)
                loadCircuitPhoto(podios.nombre_Circuito,card)
      };
    }      
    catch (err) {
        console.error('Error cargando podios', err);
    }
    }

    async function cargarTrayectoria(){
      try{
        const TrayectoriaPiloto = await fetch(`/api/piloto/obtenerTrayectoriaPiloto/${idPiloto}`).then(r=>r.json());
        const container =document.getElementById('gridTrayectoria')
        container.innerHTML='';
        for(let i=0; i<TrayectoriaPiloto.length;i++){
          const trayectoria = TrayectoriaPiloto[i];
          const cardTrayectory = document.createElement('div');
          let imgPiloto = await obtenerFotoEquipo(trayectoria.register);
          if(imgPiloto === null || imgPiloto === undefined){
            imgPiloto = await obtenerFotoEquipo(trayectoria.Equipo);
          }
          cardTrayectory.className = 'group bg-neutral-900 rounded-xl flex-none min-w-[100px] overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer relative';
          cardTrayectory.innerHTML=`
            <div class="p-4 flex flex-col items-center text-center">

            <h3 class="text-lg font-bold text-white">${trayectoria.register}</h3>
            <p class="text-sm text-neutral-400">Temporada: ${trayectoria.temporadas}</p>
            <p class="text-sm text-neutral-400">No. Victorias: ${trayectoria.victorias}</p>
            <p class="text-sm text-neutral-400">No. Poles: ${trayectoria.poles}</p>
            <p class="text-sm text-neutral-400">No. Podios: ${trayectoria.Podios}</p>
            <div class="scuderia-content">
              ${imgPiloto ? `<img src="${imgPiloto}" alt="Piloto ${trayectoria.Equipo}" class="w-24 h-24 rounded-none h-1/2s mx-auto">` : ''}
              <p class="text-white font-bold">${trayectoria.register}</p>
            </div>
            </div>
          `;
          container.appendChild(cardTrayectory)
        }
      }catch (err) {
        console.error('Error cargando trayectoria', err);
    }
    }

    async function cargarDatosPiloto() {
      try {
        // Ejemplo de llamada a tu backend para obtener info
        
        const infoPiloto = await fetch(`/api/piloto/obtenerPiloto/${idPiloto}`).then(r => r.json());
        const statsPiloto = await fetch(`/api/piloto/obtenerInfoPiloto/${idPiloto}`).then(r=> r.json());
        console.log(statsPiloto)
        var acumPuntos=0
        var acumPodios=0
        var acumVictories=0
        var acumPoles=0
        var acumStarts=0
        var acumFastLaps=0
          for (let i = 0; i < statsPiloto.length; i++) {
                    const piloto = statsPiloto[i];
                    acumPuntos += Number(piloto.puntos_totales);
                    acumPodios += Number(piloto.Podios);
                    acumVictories += Number(piloto.victorias);
                    acumPoles += Number(piloto.poles);
                    acumStarts += Number(piloto.Starts);
                    acumFastLaps += Number(piloto.FastestLaps);
          }
        const newDate = formatHistoricDate(infoPiloto.fecha_nacimiento);
        const imgPUrl = await obtenerFotoPiloto(infoPiloto.nombre_completo);
        document.getElementById("fotoPiloto").innerHTML = imgPUrl ? `<img src="${imgPUrl}" alt="Piloto ${infoPiloto.nombre_completo}" class="w-40 h-40 rounded-full border border-neutral-700 object-cover">` : '';
        document.getElementById("equipoPiloto").textContent = infoPiloto.equipo || "Sin equipo registrado";
        document.getElementById("nombrePiloto").textContent = infoPiloto.nombre_completo;
        document.getElementById("nacionalidadPiloto").textContent = infoPiloto.nacionalidad;
        document.getElementById("fechaNacimiento").textContent = newDate;
        document.getElementById("numeroPiloto").textContent = infoPiloto.identificador;
        document.getElementById("startsPiloto").textContent = acumStarts.toLocaleString("es-MX");
        document.getElementById("victoriasPiloto").textContent = acumVictories;
        document.getElementById("victoriasPct").textContent = `${(acumStarts>0?acumVictories/acumStarts*100:0).toFixed(1)}% de carreras`;
        document.getElementById("podiosPiloto").textContent = acumPodios;
        document.getElementById("podiosPct").textContent = `${(acumStarts>0?acumPodios/acumStarts*100:0).toFixed(1)}% de carreras`;
        document.getElementById("polesPiloto").textContent = acumPoles;
        document.getElementById("polesPct").textContent = `${(acumStarts>0?acumPoles/acumStarts*100:0).toFixed(1)}% de carreras`;
        document.getElementById("fastLapsPiloto").textContent = acumFastLaps;
        document.getElementById("fastLapsPct").textContent = `${(acumStarts>0?acumFastLaps/acumStarts*100:0).toFixed(1)}% de carreras`;
        document.getElementById("puntosTotales").textContent = acumPuntos.toLocaleString("es-MX",{maximumFractionDigits:2});
        document.getElementById("puntosPromedio").textContent = `${(acumStarts>0?acumPuntos/acumStarts:0).toFixed(2)} pts / carrera`;
        document.title = `  ${infoPiloto.nombre_completo} | F1 Stats`;
        
        
        
        
        
      } catch (error) {
        console.error("Error cargando datos del piloto:", error);
      }
    }
    cargarPodiosPiloto();
    cargarTrayectoria();
    cargarVictoriasPiloto();
    cargarDatosPiloto();
  </script>

</body>
