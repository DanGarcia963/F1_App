<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Selecciona categoría — Motorsport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Pequeñas reglas extra */
    .card-img {
      background-size: cover;
      background-position: center;
    }
    /* Fallback image box */
    .placeholder {
      background: linear-gradient(180deg,#111827,#0b1220);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#e5e7eb;
      font-weight:600;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 bg-black/60 backdrop-blur-sm border-b border-gray-800 z-30">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-3">
          <div class="w-10 h-10 rounded bg-red-600 flex items-center justify-center font-bold">F1</div>
          <div>
            <h1 class="text-lg font-semibold">Motorsport Hub</h1>
            <p class="text-xs text-gray-400">Elige tu categoría</p>
          </div>
        </a>
      </div>
      <div class="flex items-center gap-3">
        <nav class="hidden sm:flex gap-3 text-sm text-gray-300">
          <a href="/" class="hover:text-white">Inicio</a>
          <a href="/seasons" class="hover:text-white">Temporadas</a>
          <a href="/pilotos" class="hover:text-white">Pilotos</a>
        </nav>
        <button id="btnRefresh" class="px-3 py-2 bg-gray-800 rounded text-sm">Actualizar</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-7xl mx-auto px-4 py-10 w-full">
    <section class="mb-6">
      <h2 class="text-2xl font-bold">Selecciona la categoría</h2>
      <p class="text-sm text-gray-400 mt-1">F1, F2, F3, IndyCar y más — elige para filtrar contenido en el inicio.</p>
    </section>

    <div id="apiNotice" hidden role="alert"></div>
    <section id="categoriaGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Cards se inyectan aquí -->
    </section>

    <section class="mt-10 text-center text-gray-400">
      <p>Si tu categoría no aparece, puedes agregarla desde el panel de administración (API)</p>
    </section>
  </main>

  <footer class="py-6 text-center text-sm text-gray-500">
    © Motorsport Hub — Plantilla
  </footer>

<script>

    const grid = document.getElementById('categoriaGrid');
    const notice = document.getElementById('apiNotice');
    const refreshButton = document.getElementById('btnRefresh');

    function showNotice(message, isError = false) {
      notice.textContent = message;
      notice.className = 'mb-6 rounded-lg border p-4 text-sm ' +
        (isError ? 'border-red-600 bg-red-950/40 text-red-100' :
          'border-amber-600 bg-amber-950/30 text-amber-100');
      notice.hidden = false;
    }

    async function renderCategories(categorias) {
      grid.replaceChildren();
      if (!categorias.length) {
        showNotice('La API respondió correctamente, pero no hay categorías registradas. Verifica la tabla public.categoria en Supabase.');
        return;
      }
      notice.hidden = true;

      for (const category of categorias) {
        const name = String(category.nombre ?? 'Sin nombre');
        const id = category.id_Categoria ?? category.id_categoria;
        if (id == null) continue;

        const card = document.createElement('a');
        card.href = '/main?id=' + encodeURIComponent(id);
        card.className = 'block group rounded-xl overflow-hidden shadow-lg border border-neutral-700 bg-neutral-900 text-left hover:border-red-600 focus:outline-none focus:ring-2 focus:ring-red-600';

        const banner = document.createElement('div');
        banner.className = 'h-40 bg-gray-800 bg-cover bg-center flex items-center justify-center font-bold';
        banner.textContent = name;

        const title = document.createElement('div');
        title.className = 'p-4 text-lg font-semibold';
        title.textContent = name;
        card.append(banner, title);
        grid.append(card);

        // Las tarjetas se muestran aunque la imagen no exista.
        obtenerImage(name).then(url => {
          if (url) {
            banner.style.backgroundImage = 'url("' + url.replaceAll('"','%22') + '")';
            banner.textContent = '';
          }
        }).catch(() => {});
      }
    }

    async function cargarCategorias() {
      grid.textContent = 'Consultando categorías...';
      refreshButton.disabled = true;
      try {
        const response = await fetch('/api/categoria/?v=' + Date.now(), {cache:'no-store'});
        const contentType = response.headers.get('content-type') || '';
        if (!response.ok) {
          throw new Error('HTTP ' + response.status + ' al consultar /api/categoria/');
        }
        if (!contentType.includes('json')) {
          throw new Error('La ruta /api/categoria/ devolvió HTML en vez de JSON. Revisa el proxy Netlify → Railway.');
        }
        const data = await response.json();
        if (!Array.isArray(data)) {
          throw new Error('La API no devolvió una lista de categorías. Verifica la conexión a Supabase.');
        }
        await renderCategories(data);
      } catch (error) {
        console.error('[F1_App] Error al cargar categorías:', error);
        grid.replaceChildren();
        showNotice('No se pudieron cargar las categorías: ' + error.message + '. Comprueba /api/health y /api/categoria/ en Railway.', true);
      } finally {
        refreshButton.disabled = false;
      }
    }
    refreshButton.addEventListener('click', cargarCategorias);

  // Intenta obtener miniatura Wikipedia
    async function obtenerImage(nombre) {
  // Normaliza el nombre para que coincida con la carpeta
  const nombreCarpeta = /^(formula\s*1|f1)$/i.test(nombre.trim()) ? 'F1' : nombre.trim();
  const extensiones = ['png'];
  for (let ext of extensiones) {
    const urlLocal = `/Logos/${encodeURIComponent(nombreCarpeta)}.${ext}`;
    try {
      const res = await fetch(urlLocal, { method: 'HEAD' });
      if (res.ok) return urlLocal;
    } catch (e) { /* ignorar */ }
  }
}
  cargarCategorias();
</script>
</body>
</html>
