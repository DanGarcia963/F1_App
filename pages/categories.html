<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Selecciona categoría — Motorsport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Pequeñas reglas extra */
    .card-img {
      background-size: cover;
      background-position: center;
    }
    /* Fallback image box */
    .placeholder {
      background: linear-gradient(180deg,#111827,#0b1220);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#e5e7eb;
      font-weight:600;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 bg-black/60 backdrop-blur-sm border-b border-gray-800 z-30">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-3">
          <div class="w-10 h-10 rounded bg-red-600 flex items-center justify-center font-bold">F1</div>
          <div>
            <h1 class="text-lg font-semibold">Motorsport Hub</h1>
            <p class="text-xs text-gray-400">Elige tu categoría</p>
          </div>
        </a>
      </div>
      <div class="flex items-center gap-3">
        <nav class="hidden sm:flex gap-3 text-sm text-gray-300">
          <a href="/" class="hover:text-white">Inicio</a>
          <a href="/seasons" class="hover:text-white">Temporadas</a>
          <a href="/pilotos" class="hover:text-white">Pilotos</a>
        </nav>
        <button id="btnRefresh" class="px-3 py-2 bg-gray-800 rounded text-sm">Actualizar</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-7xl mx-auto px-4 py-10 w-full">
    <section class="mb-6">
      <h2 class="text-2xl font-bold">Selecciona la categoría</h2>
      <p class="text-sm text-gray-400 mt-1">F1, F2, F3, IndyCar y más — elige para filtrar contenido en el inicio.</p>
    </section>

    <section id="categoriaGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Cards se inyectan aquí -->
    </section>

    <section class="mt-10 text-center text-gray-400">
      <p>Si tu categoría no aparece, puedes agregarla desde el panel de administración (API)</p>
    </section>
  </main>

  <footer class="py-6 text-center text-sm text-gray-500">
    © Motorsport Hub — Plantilla
  </footer>

<script>

    async function renderCategories(categorias) {
      const grid = document.getElementById('categoriaGrid');
      grid.innerHTML = '';
      const cacheDuration = 60 * 1000; // 1 min
      for(let i=0; i<categorias.length; i++) {
        const c = categorias[i];
        // intenta obtener imagen por nombre de categoría + "car" para mejor match
        const imgUrl = await obtenerImage(c.nombre);
        const cardCategory = document.createElement('div');
        const categoryCacheKey = `cat_img_${c.id_Categoria}`;
        const categoryCacheTimeKey = `cat_img_time_${c.id_Categoria}`;
        const now = Date.now();
        let categories = null;
        const cachedImg = localStorage.getItem(categoryCacheKey);
        const cachedTime = Number(localStorage.getItem(categoryCacheTimeKey));

        if (cachedImg && cachedTime && (now - Number(cachedTime) < cacheDuration)) {
          categories = JSON.parse(cachedImg);
        } else {
            try{
            categories = await fetch('/api/categoria/').then(r => r.json());
            localStorage.setItem(categoryCacheKey, JSON.stringify(categories));
            localStorage.setItem(categoryCacheTimeKey, String(now));}
            catch(err){
              categories =[]
            }
      }
    if(categories.length > 0){
        
        cardCategory.className = 'group relative rounded-xl overflow-hidden shadow-lg border border-neutral-700 bg-neutral-900 text-left p-0 focus:outline-none focus:ring-2 focus:ring-red-600';
        cardCategory.style = 'flex;flex-direction:column;align-items:stretch;';
        cardCategory.innerHTML = `
      
        <div class="h-40 w-full ${imgUrl ? '' : 'placeholder'} card-img bg-white" style="${imgUrl ? `background-image:url('${imgUrl}')` : ''}">
        ${!imgUrl ? `<div class="h-full w-full flex items-center justify-center"> ${c.nombre ?? ''} </div>` : ''}
      </div>
    
      <div class="p-4">
        <h3 class="text-lg font-semibold mb-1">${c.nombre ?? '—'}</h3>
       
      </div>
      <div class="p-3 border-t border-neutral-800 text-sm text-gray-400">
        <span class="group-hover:text-white">Ver contenido</span>
      </div>
    `;
    }
    cardCategory.dataset.id = c.id_Categoria;
    cardCategory.dataset.name = c.nombre;
    cardCategory.addEventListener('click', () => {
        const url = `/main?id=${c.id_Categoria}`;
        console.log('Navigating to:', url);
        window.location.href = url;
    });
    grid.appendChild(cardCategory);
}
}

async function cargarCategorias(){
    const cacheKey = 'categorias_cache';
    const cacheTimeKey = 'categorias_cache_time';
    const cacheDuration = 60 * 1000; // 5 minutos

    const now = Date.now();
    const cached = localStorage.getItem(cacheKey);
    const cachedTime = Number(localStorage.getItem(cacheTimeKey));
    if (cached && cachedTime && (now - cachedTime < cacheDuration)) {
      const categorias = JSON.parse(cached);
      renderCategories(categorias);
      return;
    }
      try {
        const res = await fetch('/api/categoria/').then(r => r.json());
        localStorage.setItem(cacheKey, JSON.stringify(res));
        localStorage.setItem(cacheTimeKey, String(now));
        renderCategories(res);

      } catch (err) {
        console.warn('Error al cargar categorías desde API, usando ejemplo', err);
      }
    
}
  // Intenta obtener miniatura Wikipedia
    async function obtenerImage(nombre) {
  // Normaliza el nombre para que coincida con la carpeta
  const nombreCarpeta = nombre.trim();
  const extensiones = ['png'];
  for (let ext of extensiones) {
    const urlLocal = `/Logos/${encodeURIComponent(nombreCarpeta)}.${ext}`;
    try {
      const res = await fetch(urlLocal, { method: 'HEAD' });
      if (res.ok) return urlLocal;
    } catch (e) { /* ignorar */ }
  }
}
  cargarCategorias();
</script>
</body>
</html>
