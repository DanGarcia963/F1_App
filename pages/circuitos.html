 <main class="w-full max-w-full px-4 py-8 mx-auto">

  <script>

    // endpoints (ajusta si tu API tiene rutas distintas)
    const endpointAllCircuitos= '/api/circuito/'; // devuelve array de pilotos { id_Piloto, nombre_completo }

    //Formulario agregar piloto temporada
    const modal = document.getElementById('modalAddPilotos');
    const btnClose = document.getElementById('btnCloseAddPilotos');
    const btnSave = document.getElementById('btnSavePilotosSeason');
    const btnAddRow = document.getElementById('btnAddRow');
    const btnClearRows = document.getElementById('btnClearRows');
    const rowsTbody = document.getElementById('pilotosSeasonRows');
    const modalSeasonId = document.getElementById('modalSeasonId');
    const openAddPilotosBtn = document.getElementById('openAddPilotosBtn');

    let pilotosList = [];

    async function openAddPilotosModal(){
        try {
            if (!pilotosList.length) {
                const resp = await fetch(endpointAllCircuitos);
                pilotosList = await resp.json();
            }
        } 
        catch (err) {
            console.error('Error cargando circuitos', err); document.getElementById('gridCircuitos').textContent='No se pudieron cargar los circuitos. Revisa la API de Railway.';
            alert('No se pudieron cargar circuitos. Revisa la conexión.');
            return;
        }
        // limpiar filas y abrir con 1 fila por defecto
        rowsTbody.innerHTML = '';
        addRow(); // agrega una fila inicial
        // opcional: mover al body si no lo hiciste en HTML
        if (modal.parentElement !== document.body) document.body.appendChild(modal);
        modal.classList.remove('hidden'); modal.classList.add('flex');
    }

    function closeModalAddPilotos() {
        modal.classList.add('hidden'); modal.classList.remove('flex');
    }

            // agrega una fila al tbody. opcional: data prellenado
        let filaCount = 0;
        function addRow(data = {}) {
          filaCount++;
          const tr = document.createElement('tr');
          tr.dataset.row = filaCount;

          // valores por defecto
          const nombreVal = data.circuito_nombre ?? '';
          const cityVal = data.circuito_ciudad ?? '';
          const paisVal = data.circuito_pais ?? '';
          const longVal = data.circuito_long ?? '';
          const curvasVal = data.circuito_curvas ?? '';
          

          tr.innerHTML = `
            <td class="p-2 align-top font-semibold">${filaCount}</td>
            <td class="p-2">
                <input type="text" class="w-full bg-neutral-800 p-2 rounded input-nombre" placeholder="nombre" value="${nombreVal}">
            </td>
            <td class="p-2">
                <input type="text" class="w-full bg-neutral-800 p-2 rounded input-city" placeholder="ciudad" value="${cityVal}">
            </td>
            <td class="p-2">
                <input type="text" class="w-full bg-neutral-800 p-2 rounded input-pais" placeholder="Pais" value="${paisVal}">
            </td>
            <td class="p-2">
                <input type="number" step="0.01" class="w-full bg-neutral-800 p-2 rounded input-longitud" placeholder="Longitud en km" value="${longVal}">
            </td>
            <td class="p-2">
                <input type="number" class="w-full bg-neutral-800 p-2 rounded input-curvas" placeholder="Curvas" value="${curvasVal}">
            </td>
            
            <td class="p-2">
              <button type="button" class="btn-remove-row px-2 py-1 bg-neutral-700 rounded text-sm">Eliminar</button>
            </td>
          `;

          // si vienen valores, seleccionarlos
          rowsTbody.appendChild(tr);
          if (nombreVal) tr.querySelector('.input-nombre').value = nombreVal;
          if (cityVal) tr.querySelector('.input-city').value = cityVal;
          if (paisVal) tr.querySelector('.input-pais').value = paisVal;
            if (longVal) tr.querySelector('.input-longitud').value = longVal;
            if (curvasVal) tr.querySelector('.input-curvas').value = curvasVal;

          // handler remove
          tr.querySelector('.btn-remove-row').addEventListener('click', () => {
            tr.remove();
            // reenumerar filas
            Array.from(rowsTbody.querySelectorAll('tr')).forEach((r, idx) => {
              r.querySelector('td:first-child').textContent = idx + 1;
            });
          });
        }

        // limpiar filas
        function clearRows() {
          rowsTbody.innerHTML = '';
          filaCount = 0;
        }

                  // recolectar datos y validar
        function collectRows() {
          const rows = Array.from(rowsTbody.querySelectorAll('tr'));
          const payload = [];
          const pilotosSeleccionados = new Set();
          for (let i = 0; i < rows.length; i++) {
            const r = rows[i];
            const nombre = r.querySelector('.input-nombre')?.value;
            const city = r.querySelector('.input-city')?.value;
            const pais = r.querySelector('.input-pais')?.value;
            const long = r.querySelector('.input-longitud')?.value;
            const curvas = r.querySelector('.input-curvas')?.value;

            if (!nombre || !city || !pais || !long || !curvas) {
              // fila inválida -> rechazar
              return { ok: false, msg: `Fila ${i+1}: completa nombre, ciudad, pais,longitud y curvas.` };
            }

            if (pilotosSeleccionados.has(nombre)) {
              return { ok: false, msg: `Circuito duplicado en la fila ${i+1}.` };
            }
            pilotosSeleccionados.add(nombre);

            payload.push({
              nombre: nombre,
              ciudad: city,
              pais: pais,
              longitud_km: long ? parseFloat(long) : null,
              curvas: curvas ? parseInt(curvas) : null,
            });
          }

          if (payload.length === 0) return { ok: false, msg: 'No hay filas para guardar.' };
          return { ok: true, payload };
        }

                  // enviar payload al backend (batch)
        async function savePilotos(payload) {
          try {
            // endpoint: AJUSTA si tu API espera otra ruta
            const res = await fetch(`/api/circuito/crearCircuito`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!res.ok) {
              const txt = await res.text();
              throw new Error(txt || 'Error en servidor');
            }
            return await res.json();
          } catch (err) {
            console.error('Error guardando circuito', err);
            throw err;
          }
        }

document.getElementById("mainPage").addEventListener("click",()=>{
  window.location.href=`/main/?id=${idCategoria}`
})

document.getElementById("teamsPage").addEventListener("click",()=>{
  window.location.href=`/teams/?id=${idCategoria}`
})

document.getElementById("driversPage").addEventListener("click",()=>{
    window.location.href=`/pilotos/?id=${idCategoria}`
})
document.getElementById("seasonPage").addEventListener("click",()=>{
    window.location.href=`/seasons/?id=${idCategoria}`
})

        openAddPilotosBtn.addEventListener('click', openAddPilotosModal);
        btnClose.addEventListener('click', closeModalAddPilotos);
        btnAddRow.addEventListener('click', () => addRow());
        btnClearRows.addEventListener('click', () => clearRows());

        btnSave.addEventListener('click', async () => {
          const { ok, payload, msg } = collectRows();
          if (!ok) {
            alert(msg);
            return;
          }
          if (!confirm(`Se agregarán ${payload.length} circuitos. ¿Continuar?`)) return;
          try {
            payload.forEach(async(circuito)=>{
              console.log(circuito)
                await savePilotos(circuito);
           
            alert('Circuitos agregados correctamente');
            closeModalAddPilotos();
            // refrescar strip y WDC/WCC
            
            })
            await cargarCircuitos(); // tu función ya definida arriba
 
          } catch (err) {
            alert('Error guardando circuitos. Revisa la consola.');
          }
        });

    async function obtenerImagenWikipedia(nombre) {
      const query = encodeURIComponent(nombre);
      const url = `https://en.wikipedia.org/w/api.php?action=query&titles=${query}&prop=pageimages&format=json&pithumbsize=1000&origin=*`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const pages = data.query.pages;
        const page = Object.values(pages)[0];
        return page.thumbnail ? page.thumbnail.source : null;
      } catch (err) {
        console.error('Error obteniendo imagen de', nombre, err);
        return null;
      }
    }


    // Simulación: reemplazar fetch con tus endpoints reales
    async function cargarCircuitos() {
      try {
        const response = await fetch(endpointAllCircuitos); if(!response.ok) throw new Error('HTTP '+response.status); const circuitos = await response.json(); if(!Array.isArray(circuitos)) throw new Error('Datos de circuitos inválidos');

        const gridCircuitos = document.getElementById('gridCircuitos');
        gridCircuitos.innerHTML = '';
          for (let i = 0; i < circuitos.length; i++) {
          const c = circuitos[i];
        const imgUrl = null; // Miniatura externa opcional; no bloquear el listado.
        const cardTeam = document.createElement('div');

        cardTeam.className =`group bg-neutral-900 rounded-xl overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer relative`
        cardTeam.innerHTML = `
                <div id="idPiloto" class="p-4 flex flex-row items-center gap-4">
                ${imgUrl ? `<img src="${imgUrl}" alt="Bandera ${c.nombre}" class="w-40 h-30 rounded-lg bg-white mb-2">` : ''}
                <div class="flex flex-col">
                <p class="text-sm mx-2 text-neutral-200 font-semibold">Nombre:${c.nombre}</p>
                <p class="text-sm mx-2 text-neutral-200 font-semibold">Pais:${c.pais}</p>
                </div>
                </div>
        `;
        cardTeam.dataset.IdCircuito = c.id_Circuito;
        cardTeam.addEventListener('click', () => {
        window.location.href = `/circuito?id=${c.id_Circuito}&categoria=${idCategoria}`; // ejemplo de redirección con query
        });
        gridCircuitos.appendChild(cardTeam);
        obtenerImagenWikipedia(c.nombre).then(url=>{
          if(!url)return;
          const image=document.createElement('img');
          image.src=url;image.loading='lazy';image.alt='Circuito '+c.nombre;
          image.className='w-40 h-30 rounded-lg bg-white mb-2';
          image.onerror=()=>image.remove();
          cardTeam.querySelector('div')?.prepend(image);
        }).catch(()=>{});

        };
      } catch (err) {
        console.error('Error cargando circuitos', err);
      }
    }
    cargarCircuitos();
  </script>
