<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temporadas F1 — Plantilla</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(6px); }
    .card-img { background-size: cover; background-position: center; }
    .scrollbar-hide {
      scrollbar-width: none; /* Firefox */
    }
    #gridSeasons {
      max-height: 540px;
    }

    .scrollbar-hide::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    /* Mostrar scrollbar solo al hacer hover */
    .hover\\:scrollbar-default:hover {
      scrollbar-width: auto; /* Firefox */
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar-thumb {
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 4px;
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar-track {
      background-color: transparent;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 antialiased">
    
  <!-- NAV -->
  <header class="sticky top-0 z-40 bg-black/60 glass border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <a href="#" class="flex items-center gap-2">
          <div class="w-10 h-10 rounded flex items-center justify-center font-bold"><span id="Logo" class="font-semibold text-lg"><img src="/Logos/LogoF1.png" alt="Logo" class="w-full h-full rounded"></span></div>

        </a>
        <nav class="hidden md:flex gap-3 ml-6 text-sm text-gray-300">
          <a id="mainPage" class="px-3 py-2 hover:text-white">Inicio</a>
          <a id="teamsPage" class="px-3 py-2 hover:text-white">Equipos</a>
          <a id="seasonPage" class="px-3 py-2 hover:text-white">Temporadas</a>
          <a id="driversPage" class="px-3 py-2 hover:text-white">Pilotos</a>
          <a class="px-3 py-2 hover:text-white" href="/circuitos">Circuitos</a>
        </nav>
      </div>

    </div>
  </header>

  <!-- MAIN CONTENT - SOLUCIÓN APLICADA -->
  <main class="w-full max-w-full px-4 py-8 mx-auto">
    <div class="w-full rounded-lg overflow-hidden shadow-lg relative">
      <section class="w-full border border-neutral-700 rounded-lg shadow-lg overflow-hidden p-6 gap-6 bg-neutral-900">    
        <div id="infoGridTemporadas" class="grid grid-cols-1 gap-6 p-6 items-start">
          <div class="group bg-neutral-900 rounded-xl overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer">
            <div class="p-4 flex flex-row items-center gap-4">
              <div class="flex flex-col">
                <p class="text-2xl max-w-full text-neutral-200 font-semibold">Temporadas</p>
              </div>
            </div>
          </div>
        </div>
        <div id="gridSeasons" class="season-cards">

        </div>
      </section>
    </div>
    <!-- Footer -->
    <footer class="mt-12 text-center text-sm text-gray-400">
      <p>Plantilla de temporadas — integra tus datos desde la API y adapta los campos necesarios.</p>
    </footer>
  </main>

  <script>
            // Obtiene el id del piloto desde la URL
    const params = new URLSearchParams(window.location.search);
    const idCategoria = params.get("id") || "1";
    console.log(idCategoria)

document.getElementById("mainPage").addEventListener("click",()=>{
  window.location.href=`/main/?id=${idCategoria}`
})

document.getElementById("teamsPage").addEventListener("click",()=>{
  window.location.href=`/teams/?id=${idCategoria}`
})

document.getElementById("driversPage").addEventListener("click",()=>{
    window.location.href=`/pilotos/?id=${idCategoria}`
})
document.getElementById("seasonPage").addEventListener("click",()=>{
    window.location.href=`/seasons/?id=${idCategoria}`
})
    
    async function renderSeasons(temporadas) {
      const root=document.getElementById('gridSeasons');
      root.replaceChildren();
      const seasons=Array.isArray(temporadas)?temporadas:[];
      if(!seasons.length){
        const empty=document.createElement('p');
        empty.className='f1-empty-message';
        empty.textContent='No hay temporadas registradas para esta categoría.';
        root.append(empty);
        return;
      }
      const rankings=await Promise.allSettled(seasons.map(async season=>{
        const key='wdc_'+idCategoria+'_'+season.anio;
        const time='wdc_time_'+idCategoria+'_'+season.anio;
        const stored=localStorage.getItem(key);
        if(stored && (Date.now()-Number(localStorage.getItem(time))<60000)){
          try{return JSON.parse(stored)}catch(_){}
        }
        const res=await fetch('/api/granPremio/obtenerWDCPorAnio/'
          +encodeURIComponent(idCategoria)+'/'+encodeURIComponent(season.anio));
        if(!res.ok)throw new Error('HTTP '+res.status);
        const data=await res.json();
        const rows=Array.isArray(data)?data:[];
        localStorage.setItem(key,JSON.stringify(rows));
        localStorage.setItem(time,String(Date.now()));
        return rows;
      }));
      seasons.forEach((season,i)=>{
        const rows=rankings[i].status==='fulfilled'?rankings[i].value:[];
        const leader=Array.isArray(rows)?rows[0]:null;
        const card=document.createElement('a');
        card.className='season-card';
        card.href='/season?id='+encodeURIComponent(season.id_Temporada)
          +'&anio='+encodeURIComponent(season.anio)
          +'&categoria='+encodeURIComponent(idCategoria);
        card.dataset.IdSeason=season.id_Temporada;
        card.dataset.Anio=season.anio;
        const text=(cls,content)=>{
          const node=document.createElement('span');
          node.className=cls;
          node.textContent=String(content);
          return node;
        };
        const status=Number(season.finalizada)===1?'Campeón':'Líder';
        card.append(
          text('season-card-label','TEMPORADA'),
          text('season-card-year',season.anio),
          text('season-card-champion',status+': '+(leader?.nombre_completo||'Sin clasificación')),
          text('season-card-arrow','↗')
        );
        root.append(card);
      });
    }

    async function cargarTemporadas(){
      const cacheKey = 'temporadasCache_' + idCategoria;
      const cacheTimeKey = 'temporadasCacheTime_' + idCategoria;
      const cacheDuration = 60 * 1000; //

      const now = Date.now();
      const cachedData = localStorage.getItem(cacheKey);  
      const cachedTime = localStorage.getItem(cacheTimeKey);
      if (cachedData && cachedTime && (now - cachedTime < cacheDuration)) {
        console.log('Usando datos en caché para temporadas');
        const temporadas = JSON.parse(cachedData);
        renderSeasons(temporadas);
        return;
      }
      try{
        
        const temporadas = await fetch(`/api/temporada/`).then(r=>r.json());
        localStorage.setItem(cacheKey, JSON.stringify(temporadas));
        localStorage.setItem(cacheTimeKey, now);
        renderSeasons(temporadas);
      }catch (err) {
        console.error('Error cargando trayectoria', err);
    }
    }

    cargarTemporadas();


  </script>
</body>
</html>
