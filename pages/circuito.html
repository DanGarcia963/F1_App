<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Información del Piloto</title>
  
  <link href="styles/style.css" rel="stylesheet">
  <style>
    .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(6px); }
    .card-img { background-size: cover; background-position: center; }
      #gridVictories{
    max-height: 250px;
  }
  #gridPodios, #gridTrayectoria{
        max-height: 250px;
  }
    .scrollbar-hide {
      scrollbar-width: none; /* Firefox */
    }

    .scrollbar-hide::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .scuderia-content img {
        max-width: 80%;
        max-height: 120px;
        width: auto;
        height: auto;
        object-fit: cover;
        margin-bottom: 0.5rem;
      }

      .scuderia-content p {
        font-size: 1.1rem;
        word-break: break-word;
        text-align: center;
        margin: 0;
        padding: 0 0.5rem;
      }

      /* Responsive para cards pequeñas */
      @media (max-width: 500px) {
        .scuderia-content img {
          max-width: 60%;
          max-height: 70px;
        }
        .scuderia-content p {
          font-size: 0.95rem;
        }
      }

      .scuderia-content {
        position: absolute;
        top: -100%;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(20,20,20,0.92);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all .5s;
        pointer-events: none;
        z-index: 10;
      }

      .group:hover .scuderia-content {
        top: 0;
        opacity: 1;
        pointer-events: auto;
      }

    /* Mostrar scrollbar solo al hacer hover */
    .hover\\:scrollbar-default:hover {
      scrollbar-width: auto; /* Firefox */
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar-thumb {
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 4px;
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar-track {
      background-color: transparent;
    }
  </style>
</head>
<body class="bg-neutral-950 text-white min-h-screen items-center p-6">
  <div class="grid grid-cols-1 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-7 rounded-lg overflow-hidden shadow-lg relative">
  
    <!-- Contenedor principal -->
  <section class="bg-neutral-900 col-span-1 lg:col-span-2 xl:col-span-3 2xl:col-span-3 2xl:col-start-1 border border-neutral-700 rounded-lg overflow-hidden shadow-lg max-w-[950px] p-4">
    <!-- Foto del piloto -->
    <div class="flex-shrink-0 flex flex-col items-center grid justify-items-stretch">
      <span  id="bandera"></span>
      <span id="fotoCircuito"></span>
      <p id="nombreCircuito" class="mt-4 text-xl font-bold"></p>
    </div>
    <!-- Datos del piloto -->
    <div id="infoGridDetalles" class="grid grid-cols-1 p-4 items-start">
        <h2 class="text-2xl font-semibold mb-4 border-b border-neutral-700 pb-2">Detalles del Circuito</h2>
    </div>

    <div class="grid grid-cols-2 gap-4 items-stretch">
      <div class="col-span-1 gap-x-5 justify-self-center">
          <span class="font-semibold mb-2">Nombre Circuito: </span> <span id="nombre_Circuito"></span><br>
          <span class="font-semibold mb-2">Pais: </span> <span id="pais"></span><br>
          <span class="font-semibold mb-2">Ciudad: </span> <span id="city"></span><br>
          <span class="font-semibold mb-2">Longitud: </span><span id="long"></span><br>
          <span class="font-semibold mb-2">Numero de curvas:</span> <span id="curvas"></span><br>
      </div>
      <div class="col-span-1 gap-x-5 justify-self-center">
        <p class="font-semibold mb-2">PILOTO MAS GANADOR:</p>
        <span id="fotoMaximoGanador"></span>
        <p id="nombreMaximoGanador" class="mt-2 text-lg font-bold"></p>
        <span class="font-semibold mb-2">Victorias: </span> <span id="numVictorias"></span><br>
      </div>

    </div>
  </section>

  <section class="bg-neutral-900 col-span-1 lg:col-span-3 xl:col-span-3 2xl:col-span-2 2xl:col-start-4 border border-neutral-700 rounded-lg overflow-hidden shadow-lg max-w-[950px] p-4">
    <div id="infoGridRecordPole" class="grid grid-cols-1 gap-4 p-4 items-start">
      <div class="group bg-neutral-900 rounded-xl overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer">
        <div class="p-4 flex flex-row items-center gap-4">
          <div class="flex flex-col">
            <p class="text-2xl max-w-full text-neutral-200 font-semibold">Record Pole Position</p>
          </div>
        </div>
      </div>
    </div>
    <div class="flex-shrink-0 flex flex-col items-center justify-center grid justify-items-stretch">
      
      <span id="fotoPiloto"></span>
      <p id="nombrePiloto" class="mt-4 text-xl font-bold"></p>
    </div>
    <div class="flex flex-row lg:flex-row gap-4 items-stretch">
      <div class="flex flex-col items-start">
          <span class="font-semibold mb-2">Carrera: </span> <span id="race"></span>
          <span class="font-semibold mb-2">Tiempo Record: </span> <span id="time_record"></span>
      </div>
    </div>
  </section>

    <section class="bg-neutral-900 col-span-1 lg:col-span-3 xl:col-span-3 2xl:col-span-2 2xl:row-start-1 2xl:col-start-6 border border-neutral-700 rounded-lg overflow-hidden shadow-lg max-w-[950px] p-4">
    <div id="infoGridVueltaRapida" class="grid grid-cols-1 gap-4 p-4 items-start">
      <div class="group bg-neutral-900 rounded-xl overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer">
        <div class="p-4 flex flex-row items-center gap-4">
          <div class="flex flex-col">
            <p class="text-2xl max-w-full text-neutral-200 font-semibold">Record Vuelta Rapida</p>
          </div>
        </div>
      </div>
    </div>
    <div class="flex-shrink-0 flex flex-col items-center justify-center grid justify-items-stretch">
      
      <span id="fotoPilotoV"></span>
      <p id="nombrePilotoV" class="mt-4 text-xl font-bold"></p>
    </div>
    <div class="flex flex-row lg:flex-row gap-4 items-stretch">
      <div class="flex flex-col items-start">
          <span class="font-semibold mb-2">Carrera: </span> <span id="raceV"></span>
          <span class="font-semibold mb-2">Tiempo Record: </span> <span id="time_recordV"></span>
      </div>
    </div>
  </section>

</div>
  <!-- Script para cargar datos -->
  <script>
    // Obtiene el id del piloto desde la URL
    const params = new URLSearchParams(window.location.search);
    const selectedCategory = params.get("categoria") || sessionStorage.getItem("f1_categoria") || "1";
    const categoryQuery = "?categoria=" + encodeURIComponent(/^\d+$/.test(selectedCategory) ? selectedCategory : "1");
    const IdCircuito = params.get("id");
    console.log(IdCircuito)

    async function obtenerFotoPiloto(nombrePiloto) {
  // Normaliza el nombre para que coincida con la carpeta
  const nombreCarpeta = nombrePiloto.trim();
  const extensiones = ['jpg', 'png', 'jpeg', 'webp','avif'];
  for (let ext of extensiones) {
    const urlLocal = `/Driver_photos/${encodeURIComponent(nombreCarpeta)}/driver.${ext}`;
    try {
      const res = await fetch(urlLocal, { method: 'HEAD' });
      if (res.ok) return urlLocal;
    } catch (e) { /* ignorar */ }
  }
  // Si no hay foto local, busca en Wikipedia
  return await obtenerImagenWikipedia(nombrePiloto);
}

    async function obtenerImagenWikipedia(nombre) {
      const query = encodeURIComponent(nombre);
      const url = `https://en.wikipedia.org/w/api.php?action=query&titles=${query}&prop=pageimages&format=json&pithumbsize=1000&origin=*`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const pages = data.query.pages;
        const page = Object.values(pages)[0];
        return page.thumbnail ? page.thumbnail.source : null;
      } catch (err) {
        console.error('Error obteniendo imagen de', nombre, err);
        return null;
      }
    }


    async function cargarDatosCircuito() {
      const setText=(id,value)=>{ const node=document.getElementById(id);if(node)node.textContent=value??'—'; };
      const setImage=(id,url,alt)=> {
        const node=document.getElementById(id);
        if(!node||!url)return;
        const img=document.createElement('img');
        img.src=url;img.alt=alt;
        img.loading='lazy';
        img.className='w-32 h-32 rounded-xl border border-neutral-700 object-cover';
        node.replaceChildren(img);
      };
      const query=async (route)=>{
        const response=await fetch(route);
        if(response.status===404)return null;
        if(!response.ok)throw new Error('HTTP '+response.status+' en '+route);
        return response.json();
      };
      try {
        const info=await query('/api/circuito/obtenerCircuito/'+encodeURIComponent(IdCircuito));
        if(!info){setText('nombre_Circuito','Circuito no encontrado');return;}
        setText('nombre_Circuito',info.nombre);
        setText('pais',info.pais);
        setText('city',info.ciudad);
        setText('long',info.longitud_km!=null ? info.longitud_km+' km' : '—');
        setText('curvas',info.curvas);
        document.title=info.nombre+' | F1 Stats';
        // No bloquear la ficha mientras se consulta la miniatura externa.
        Promise.allSettled([
          obtenerImagenWikipedia(info.nombre),
          obtenerImagenWikipedia(info.pais)
        ]).then(results=>{
          if(results[0].status==='fulfilled')setImage('fotoCircuito',results[0].value,'Circuito '+info.nombre);
          if(results[1].status==='fulfilled')setImage('bandera',results[1].value,'Bandera '+info.pais);
        });
        const qs=await Promise.allSettled([
          query('/api/circuito/obtenerRecordPole/'+encodeURIComponent(IdCircuito)+categoryQuery),
          query('/api/circuito/obtenerRecordVuelta/'+encodeURIComponent(IdCircuito)+categoryQuery),
          query('/api/circuito/obtenerMaxVencedor/'+encodeURIComponent(IdCircuito)+categoryQuery)
        ]);
        const [pole,vr,winner]=qs.map(x=>x.status==='fulfilled'?x.value:null);
        setText('nombrePiloto',pole?.nombre_completo || 'Sin récord registrado');
        setText('race',pole?.nombre_oficial || '—');
        setText('time_record',pole?.tiempo_pole || '—');
        setText('nombrePilotoV',vr?.nombre_completo || 'Sin récord registrado');
        setText('raceV',vr?.nombre_oficial || '—');
        setText('time_recordV',vr?.tiempo_vuelta_rapida || '—');
        setText('nombreMaximoGanador',winner?.nombre_completo || 'Sin victorias registradas');
        setText('numVictorias',winner?.total_victorias ?? 0);
        for(const [detail,element] of [[pole,'fotoPiloto'],[vr,'fotoPilotoV'],[winner,'fotoMaximoGanador']]){
          if(detail?.nombre_completo)obtenerFotoPiloto(detail.nombre_completo)
            .then(url=>setImage(element,url,'Piloto '+detail.nombre_completo))
            .catch(()=>{});
        }
      } catch(err) {
        console.error('[F1_APP] Error en ficha de circuito',err);
        setText('nombre_Circuito','No se pudieron cargar los datos del circuito');
      }
    }
    cargarDatosCircuito();
  </script>

</body>
</html>
