<!doctype html>
<html lang="es">
<head>

  <style>
    .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(6px); }
    .card-img { background-size: cover; background-position: center; }
      #gridVictories{
    max-height: 250px;
  }
  #gridPodios, #gridTrayectoria{
        max-height: 250px;
  }
    .scrollbar-hide {
      scrollbar-width: none; /* Firefox */
    }

    .scrollbar-hide::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .scuderia-content img {
        max-width: 80%;
        max-height: 120px;
        width: auto;
        height: auto;
        object-fit: cover;
        margin-bottom: 0.5rem;
      }

      .scuderia-content p {
        font-size: 1.1rem;
        word-break: break-word;
        text-align: center;
        margin: 0;
        padding: 0 0.5rem;
      }

      /* Responsive para cards pequeñas */
      @media (max-width: 500px) {
        .scuderia-content img {
          max-width: 60%;
          max-height: 70px;
        }
        .scuderia-content p {
          font-size: 0.95rem;
        }
      }

      .scuderia-content {
        position: absolute;
        top: -100%;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(20,20,20,0.92);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all .5s;
        pointer-events: none;
        z-index: 10;
      }

      .group:hover .scuderia-content {
        top: 0;
        opacity: 1;
        pointer-events: auto;
      }

    /* Mostrar scrollbar solo al hacer hover */
    .hover\\:scrollbar-default:hover {
      scrollbar-width: auto; /* Firefox */
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar-thumb {
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 4px;
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar-track {

    }

<body class="bg-neutral-950 text-white min-h-screen items-center p-6">
  <div class="grid grid-cols-1 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-7 rounded-lg overflow-hidden shadow-lg relative">
  
    <!-- Contenedor principal -->
  <section class="bg-neutral-900 col-span-1 lg:col-span-2 xl:col-span-3 2xl:col-span-3 2xl:col-start-1 border border-neutral-700 rounded-lg overflow-hidden shadow-lg max-w-[950px] p-4">

    </div>
    <!-- Datos del piloto -->
    <div id="infoGridDetalles" class="grid grid-cols-1 p-4 items-start">

    <div class="grid grid-cols-2 gap-4 items-stretch">

  <section class="bg-neutral-900 col-span-1 lg:col-span-3 xl:col-span-3 2xl:col-span-2 2xl:col-start-4 border border-neutral-700 rounded-lg overflow-hidden shadow-lg max-w-[950px] p-4">
    <div id="infoGridRecordPole" class="grid grid-cols-1 gap-4 p-4 items-start">
      <div class="group bg-neutral-900 rounded-xl overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer">
        <div class="p-4 flex flex-row items-center gap-4">

            <p class="text-2xl max-w-full text-neutral-200 font-semibold">Record Pole Position</p>

        </div>

    </div>
    <div class="flex-shrink-0 flex flex-col items-center justify-center grid justify-items-stretch">
      
      <span id="fotoPiloto"></span>

    </div>
    <div class="flex flex-row lg:flex-row gap-4 items-stretch">

    </div>
  </section>

    <section class="bg-neutral-900 col-span-1 lg:col-span-3 xl:col-span-3 2xl:col-span-2 2xl:row-start-1 2xl:col-start-6 border border-neutral-700 rounded-lg overflow-hidden shadow-lg max-w-[950px] p-4">
    <div id="infoGridVueltaRapida" class="grid grid-cols-1 gap-4 p-4 items-start">
      <div class="group bg-neutral-900 rounded-xl overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer">

    <div class="flex-shrink-0 flex flex-col items-center justify-center grid justify-items-stretch">
      
      <span id="fotoPilotoV"></span>
      <p id="nombrePilotoV" class="mt-4 text-xl font-bold"></p>
    </div>
    <div class="flex flex-row lg:flex-row gap-4 items-stretch">
      <div class="flex flex-col items-start">
          <span class="font-semibold mb-2">Carrera: </span> <span id="raceV"></span>
          <span class="font-semibold mb-2">Tiempo Record: </span> <span id="time_recordV"></span>
      </div>

</div>
  <!-- Script para cargar datos -->
  <script>
    // Obtiene el id del piloto desde la URL
    const params = new URLSearchParams(window.location.search);
    const IdCircuito = params.get("id");
    console.log(IdCircuito)

    async function obtenerFotoPiloto(nombrePiloto) {
  // Normaliza el nombre para que coincida con la carpeta
  const nombreCarpeta = nombrePiloto.trim();
  const extensiones = ['jpg', 'png', 'jpeg', 'webp','avif'];
  for (let ext of extensiones) {
    const urlLocal = `/Driver_photos/${encodeURIComponent(nombreCarpeta)}/driver.${ext}`;
    try {
      const res = await fetch(urlLocal, { method: 'HEAD' });
      if (res.ok) return urlLocal;
    } catch (e) { /* ignorar */ }
  }
  // Si no hay foto local, busca en Wikipedia
  return await obtenerImagenWikipedia(nombrePiloto);
}

    async function obtenerImagenWikipedia(nombre) {
      const query = encodeURIComponent(nombre);
      const url = `https://en.wikipedia.org/w/api.php?action=query&titles=${query}&prop=pageimages&format=json&pithumbsize=1000&origin=*`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const pages = data.query.pages;
        const page = Object.values(pages)[0];
        return page.thumbnail ? page.thumbnail.source : null;
      } catch (err) {
        console.error('Error obteniendo imagen de', nombre, err);
        return null;
      }
    }


    async function cargarDatosCircuito() {
      try {
        // Ejemplo de llamada a tu backend para obtener info
        
        const infoCircuito = await fetch(`/api/circuito/obtenerCircuito/${IdCircuito}`).then(r => r.json());
        const recordPole = await fetch(`/api/circuito/obtenerRecordPole/${IdCircuito}`).then(r=> r.json());
        const recordVuelta = await fetch(`/api/circuito/obtenerRecordVuelta/${IdCircuito}`).then(r=> r.json());
        const maximoGanador = await fetch(`/api/circuito/obtenerMaxVencedor/${IdCircuito}`).then(r=> r.json());
        console.log(infoCircuito);
        console.log(recordPole);
        console.log(recordVuelta);
       
        const imgPUrl = await obtenerImagenWikipedia(infoCircuito.nombre);
        const imgCUrl = await obtenerImagenWikipedia(infoCircuito.pais);
        const imgUrl = await obtenerFotoPiloto(recordPole.nombre_completo);
        const imgVUrl = await obtenerFotoPiloto(recordVuelta.nombre_completo);
        const imgMaxUrl = await obtenerFotoPiloto(maximoGanador.nombre_completo);
        document.getElementById("bandera").innerHTML = `<img src="${imgCUrl}" alt="Piloto ${infoCircuito.pais}" class="w-40 h-30 rounded-none justify-self-start border border-neutral-700 bg-white object-cover">`
        
        document.getElementById("fotoCircuito").innerHTML =  `<img src="${imgPUrl}" alt="Piloto ${infoCircuito.nombre}" class="w-42 h-32 rounded-full justify-self-center border border-neutral-700 bg-white object-cover">`
        
        document.getElementById("nombre_Circuito").textContent = infoCircuito.nombre;
        document.getElementById("pais").textContent = infoCircuito.pais;
        document.getElementById("city").textContent = infoCircuito.ciudad;
        document.getElementById("long").textContent = (infoCircuito.longitud_km + " km");
        document.getElementById("curvas").textContent = infoCircuito.curvas;
        document.title = `  ${infoCircuito.nombre} | F1 Stats`;

        const year = new Date(recordPole.fecha).getFullYear();
        console.log(year);
        document.getElementById("nombrePiloto").textContent = recordPole.nombre_completo;
        document.getElementById("fotoPiloto").innerHTML =  `<img src="${imgUrl}" alt="Piloto ${recordPole.nombre_completo}" class="w-32 h-32 rounded-full justify-self-center border border-neutral-700 bg-white object-cover">`
        document.getElementById("race").textContent = `${recordPole.nombre_oficial} ${year}`;
        document.getElementById("time_record").textContent = recordPole.tiempo_pole;

        const yearV = new Date(recordVuelta.fecha).getFullYear();
        console.log(yearV);
        document.getElementById("nombrePilotoV").textContent = recordVuelta.nombre_completo;
        document.getElementById("fotoPilotoV").innerHTML =  `<img src="${imgVUrl}" alt="Piloto ${recordVuelta.nombre_completo}" class="w-32 h-32 rounded-full justify-self-center border border-neutral-700 bg-white object-cover">`
        document.getElementById("raceV").textContent = `${recordVuelta.nombre_oficial} ${yearV}`;
        document.getElementById("time_recordV").textContent = recordVuelta.tiempo_vuelta_rapida;
   
        document.getElementById("fotoMaximoGanador").innerHTML =  `<img src="${imgMaxUrl}" alt="Piloto ${maximoGanador.nombre_completo}" class="w-32 h-32 rounded-full justify-self-center border border-neutral-700 bg-white object-cover">`
        document.getElementById("nombreMaximoGanador").textContent = maximoGanador.nombre_completo;
        document.getElementById("numVictorias").textContent = maximoGanador.total_victorias
      } catch (error) {
        console.error("Error cargando datos del piloto:", error);
      }
    }
    cargarDatosCircuito();
  </script>
