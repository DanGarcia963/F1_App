<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>F1 APP — Plantilla con Campeonato</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="styles/style.css" rel="stylesheet">
<style>
    .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(6px); }
    .card-img { background-size: cover; background-position: center; }
    .scrollbar-hide {
      scrollbar-width: none; /* Firefox */
    }
    #gridWDC, #gridWCC, #gridGPs {
      max-height: 500px;
    }

    .scrollbar-hide::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    /* Mostrar scrollbar solo al hacer hover */
    .hover\\:scrollbar-default:hover {
    scrollbar-width: auto; /* Firefox */
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar {
    width: 8px;
    height: 8px;
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar-thumb {
    background-color: rgba(0, 0, 0, 0.5);
    border-radius: 4px;
    }

    .hover\\:scrollbar-default:hover::-webkit-scrollbar-track {
    background-color: transparent;
    }
</style>
</head>
<body class="bg-gray-900 text-gray-100 antialiased">
  <!-- NAV -->
  <header class="sticky top-0 z-40 bg-black/60 glass border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <a href="#" class="flex items-center gap-2">
          <div class="w-10 h-10 rounded flex items-center justify-center font-bold"><span id="Logo" class="font-semibold text-lg"><img src="/Logos/F1.png" alt="Logo" class="w-full h-full rounded"></span></div>

        </a>
        <nav class="hidden md:flex gap-3 ml-6 text-sm text-gray-300">
          <a id="mainPage" class="px-3 py-2 hover:text-white">Inicio</a>
          <a id="teamsPage" class="px-3 py-2 hover:text-white">Equipos</a>
          <a id="seasonPage" class="px-3 py-2 hover:text-white">Temporadas</a>
          <a id="driversPage" class="px-3 py-2 hover:text-white">Pilotos</a>
          <a class="px-3 py-2 hover:text-white" href="/circuitos">Circuitos</a>
        </nav>
      </div>

      <div class="flex items-center gap-3">
        <!-- Contenedor del siguiente GP -->
        <div id="nextGPContainer" class="flex items-center content-center gap-2 bg-gray-800 rounded px-3 py-2 text-sm font-medium">
          <span id="text-GP" class="font-semibold"></span>
          <span id="nextGPFlag" class="mr-2"></span>
          <span id="nextGPName" class="font-semibold"></span>
          <span id="nextGPDate" class="ml-2 text-gray-300"></span>
        </div>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <main class="min-w-md max-w-full mx-auto px-4 py-8">
    <div class="grid f1-championship-layout">
      <section id="WDCSection"class="md:col-span-3 lg:col-span-2 lg:col-start-4 lg:row-start-2 xl:col-span-2 xl:col-start-6 xl:row-start-1 2xl:col-span-2 2xl:col-start-8 bg-gray-800 gap-4 p-4 rounded-lg overflow-hidden shadow-lg relative">
        <!-- Campeonato -->
        <div id="infoGridWDC" class="grid grid-cols-1 p-6 items-start">
          <div class="group bg-neutral-900 rounded-xl overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer">
            <div class="p-4 flex flex-row items-center gap-4">
              <div class="flex flex-col">
                <p class="f1-championship-heading">Pilotos <span>WDC</span></p>
              </div>
            </div>
          </div>
        </div>

        <div id="gridWDC"
          class="flex snap-x snap-mandatory lg:grid lg:grid-cols-1 gap-6 p-6 max-w-full items-start 
          overflow-x-auto lg:overflow-x-visible 
          overflow-y-hidden lg:overflow-y-auto 
          scroll-smooth scrollbar-thin scrollbar-thumb-red-700 scrollbar-track-red-900 scrollbar-hide hover:scrollbar-default">
        </div>
      </section>
      <!-- World Constructors Championship -->
      <section id="WCCSection" class="md:col-span-3 lg:col-span-5 lg:col-start-1 lg:row-start-1 xl:col-span-2 xl:col-start-1 xl:row-start-1 2xl:col-span-2 2xl:col-start-1 2xl:row-start-1 bg-gray-800 gap-4 p-4 rounded-lg overflow-hidden shadow-lg relative">
        <div id="infoGridWCC" class="grid grid-cols-1 lg:grid-cols-1 xl:grid-cols-1 2xl:grid-cols-1 p-6 items-start">
          <div class="group bg-neutral-900 rounded-xl overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer">
            <div class="p-4 flex flex-row items-center gap-4">
              <div class="flex flex-col">
                <p class="f1-championship-heading">Constructores <span>WCC</span></p>
              </div>
            </div>
          </div>
        </div>
        <div id="gridWCC" 
          class="flex snap-x snap-mandatory xl:grid xl:grid-cols-1 gap-6 p-6 max-w-full items-start 
          overflow-x-auto xl:overflow-x-visible 
          overflow-y-hidden xl:overflow-y-auto 
          scroll-smooth scrollbar-thin scrollbar-thumb-red-700 scrollbar-track-red-900 scrollbar-hide hover:scrollbar-default">
        </div>

      </section>
      <!-- Grand Prix Section -->
      <section id="GPSection" class="md:col-span-3 lg:col-span-3 lg:col-start-1 lg:row-start-2 xl:col-span-3 xl:col-start-3 xl:row-start-1 2xl:col-span-5 2xl:col-start-3 2xl:row-start-1 bg-gray-800 rounded-lg overflow-hidden shadow-lg relative">
        <div class="relative">
          <div class="bg-gray-800 rounded-lg p-4 shadow">
            <h2 class="text-2xl font-bold">Grandes Premios <span id="anio"></span></h2>
            <div id="gridGPs" 
              class="flex snap-x snap-mandatory lg:grid lg:grid-cols-3 xl:grid-cols-3 2xl:grid-cols-4 gap-6 p-6 max-w-full items-start
              overflow-x-auto lg:overflow-x-visible 
              overflow-y-hidden lg:overflow-y-auto 
              scroll-smooth scrollbar-thin scrollbar-thumb-red-700 scrollbar-track-red-900 scrollbar-hide hover:scrollbar-default">
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script>
(() => {
  'use strict';
  const params = new URLSearchParams(window.location.search);
  const selected = params.get('id') || params.get('categoria') || sessionStorage.getItem('f1_categoria') || '1';
  const idCategoria = /^\d+$/.test(selected) && Number(selected) > 0 ? selected : '1';
  sessionStorage.setItem('f1_categoria', idCategoria);
  let currentYear = null;

  for (const [id,path] of [
    ['mainPage','/main'],['teamsPage','/teams'],
    ['driversPage','/pilotos'],['seasonPage','/seasons']
  ]) {
    const element = document.getElementById(id);
    if (element) {
      element.setAttribute('href',path+'?id='+idCategoria);
      element.addEventListener('click', () => window.location.assign(path+'?id='+idCategoria));
    }
  }

  const $ = id => document.getElementById(id);
  const create = (tag,className,value) => {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (value !== undefined && value !== null) e.textContent = String(value);
    return e;
  };
  async function getJSON(path) {
    const response = await fetch(path, {headers:{Accept:'application/json'},cache:'no-store'});
    if (!response.ok) {
      let serverMessage = '';
      try {
        const body = await response.json();
        serverMessage = typeof body?.message === 'string' ? body.message : '';
      } catch (_) { /* Netlify may return an HTML 404 page */ }
      const error = new Error('HTTP '+response.status+' en '+path+(serverMessage ? ': '+serverMessage : ''));
      error.httpStatus = response.status;
      error.requestPath = path;
      throw error;
    }
    const data = await response.json();
    if (data && !Array.isArray(data) && data.message && !data.anio) throw new Error(data.message);
    return data;
  }
  // Fallback de compatibilidad: el despliegue anterior no tenia temporada-actual.
  // No se usa el año del navegador como dato: se buscan carreras reales por categoria.
  async function getSeasonForCategory() {
    const url = '/api/categoria/'+encodeURIComponent(idCategoria)+'/temporada-actual';
    try {
      const season = await getJSON(url);
      if (season && Number.isInteger(Number(season.anio))) return season;
      throw new Error('La API no devolvio el año de la temporada');
    } catch (error) {
      if (error.httpStatus !== 404) throw error;
      console.warn('[F1_APP] La ruta nueva aun no existe en Railway. Usando consulta historica.',url);
    }
    const data = await getJSON('/api/temporada/');
    if (!Array.isArray(data)) throw new Error('El listado de temporadas no tiene el formato esperado');
    const candidates = data
      .filter(s => Number.isInteger(Number(s.anio)) && Number(s.anio) <= new Date().getFullYear())
      .sort((x,y) => Number(y.anio)-Number(x.anio));
    for (const candidate of candidates) {
      const gpPath = '/api/granPremio/obtenerGPTemporada/'+encodeURIComponent(idCategoria)+'/'+candidate.anio;
      try {
        const gp = await getJSON(gpPath);
        if (Array.isArray(gp) && gp.length) return { ...candidate, __calendar:gp, __fallback:true };
      } catch (error) {
        if (error.httpStatus !== 404) throw error;
      }
    }
    throw new Error('No existen carreras asociadas con esta categoria en las temporadas consultadas.');
  }
  const list = (value,name) => {
    if (!Array.isArray(value)) throw new Error('Formato de datos inesperado para '+name);
    return value;
  };
  function message(container,text,isError=false) {
    if (!container) return;
    container.replaceChildren();
    const panel = create('div','f1-empty-message',text);
    panel.setAttribute('role',isError?'alert':'status');
    container.append(panel);
  }
  function errorIn(section,text) {
    const target = $(section);
    message(target,'No se pudieron cargar '+text+'. Comprueba Railway en /diagnostico.',true);
  }
  const dateKey = raw => String(raw||'').slice(0,10);
  const prettyDate = raw => {
    const s = dateKey(raw);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return 'Fecha pendiente';
    return new Intl.DateTimeFormat('es-MX',{timeZone:'UTC',day:'numeric',month:'short',year:'numeric'})
      .format(new Date(s+'T12:00:00Z'));
  };
  function addImage(box,filename,kind) {
    const img = create('img','f1-list-image');
    img.alt = filename;
    img.loading = 'lazy';
    img.decoding = 'async';
    const candidates = kind === 'driver'
      ? [String(currentYear)+'.png','2025.png','driver.jpg','driver.webp']
        .map(file => '/Driver_photos/'+encodeURIComponent(filename)+'/'+encodeURIComponent(file))
        .concat(['/Driver_photos/default.png'])
      : ['/Team_photos/'+encodeURIComponent(filename)+'.png'];
    let index=0;
    img.onerror = () => {
      index++;
      if (index >= candidates.length) { img.remove(); return; }
      img.src = candidates[index];
    };
    img.src=candidates[index];
    box.append(img);
  }
  function clickableCard(container,url,style) {
    const card=create('a',style);
    card.href=url;
    container.append(card);
    return card;
  }
  function renderGPs(gps) {
    const root=$('gridGPs');
    if (!gps.length) return message(root,'No hay Grandes Premios registrados para esta temporada.');
    root.replaceChildren();
    for (const gp of gps) {
      const id=gp.id_GP ?? gp.id_gp;
      const card=clickableCard(root,
        '/granPremio?id='+encodeURIComponent(id)+'&categoria='+idCategoria,
        'group bg-neutral-900 rounded-xl flex-none min-w-[100px] snap-center overflow-hidden shadow-lg border border-neutral-700 transition-all duration-500 cursor-pointer relative');
      const body=create('div','p-4 flex flex-col gap-2');
      const label=create('span','f1-card-eyebrow',gp.Ganador==='Aún no se disputa'?'PRÓXIMAMENTE':'GRAN PREMIO');
      const name=create('h3','text-lg font-bold',gp.Nombre_GP||gp.nombre_oficial||'Gran Premio');
      const date=create('p','text-sm text-neutral-400',prettyDate(gp.fecha));
      const track=create('p','text-sm text-neutral-500',gp.Nombre_Circuito||'Circuito por confirmar');
      const result=create('p','f1-card-result',gp.Ganador&&gp.Ganador!=='Aún no se disputa'
        ? 'Ganador: '+gp.Ganador : 'Por disputar');
      body.append(label,name,date,track,result);
      card.append(body);
    }
  }
  function renderStandings(items,kind) {
    const drivers=kind==='driver';
    const root=$(drivers?'gridWDC':'gridWCC');
    if (!items.length) return message(root,
      drivers?'Aún no hay clasificación de pilotos.':'Aún no hay clasificación de constructores.');
    root.replaceChildren();
    for(let i=0;i<items.length;i++) {
      const p=items[i];
      const id=drivers?(p.id_Piloto??p.id_piloto):(p.id_Equipo??p.id_equipo);
      const name=drivers?(p.nombre_completo||p.Piloto||'Piloto'):(p.equipo||p.Equipo||'Equipo');
      const card=clickableCard(root,
        (drivers?'/piloto?id=':'/team?id=')+encodeURIComponent(id)+'&categoria='+idCategoria,
        'group bg-neutral-900 rounded-xl overflow-hidden border border-neutral-700 transition-all duration-500 cursor-pointer');
      const row=create('div','p-4 flex flex-row items-center gap-3');
      row.append(create('span','f1-rank',i+1));
      const photo=create('span','f1-list-photo');
      addImage(photo,name,drivers?'driver':'team');
      row.append(photo);
      const info=create('div','flex flex-col f1-rank-label');
      info.append(create('strong','text-sm text-neutral-200',name));
      const score=Number(p.puntos_totales||0);
      info.append(create('span','text-sm text-neutral-400',
        Number.isFinite(score)?score.toLocaleString('es-MX')+' pts':'—'));
      row.append(info);
      card.append(row);
    }
  }
  function renderNextGP(gps) {
    const container=$('nextGPContainer');
    if (!container) return;
    const today=new Date();
    const todayKey=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),
      String(today.getDate()).padStart(2,'0')].join('-');
    const upcoming=gps.filter(gp=>dateKey(gp.fecha)>=todayKey)
      .sort((a,b)=>dateKey(a.fecha).localeCompare(dateKey(b.fecha)))[0];
    container.style.display='';
    if(!upcoming) {
      $('text-GP').textContent='CALENDARIO';
      $('nextGPName').textContent='Fin de la temporada';
      $('nextGPDate').textContent='';
      return;
    }
    $('text-GP').textContent='PRÓXIMA CARRERA';
    $('nextGPName').textContent=upcoming.Nombre_GP||upcoming.nombre_oficial;
    $('nextGPDate').textContent=prettyDate(upcoming.fecha);
    const id=upcoming.id_GP??upcoming.id_gp;
    container.tabIndex=0;
    container.setAttribute('role','link');
    container.style.cursor='pointer';
    const open=()=>window.location.assign('/granPremio?id='+encodeURIComponent(id)+'&categoria='+idCategoria);
    container.addEventListener('click',open,{once:true});
    container.addEventListener('keydown',event=>{if(event.key==='Enter')open();},{once:true});
  }

  async function start() {
    message($('gridGPs'),'Cargando calendario...');
    message($('gridWDC'),'Consultando clasificación...');
    message($('gridWCC'),'Consultando clasificación...');
    let actual;
    try {
      actual=await getSeasonForCategory();
      if (!actual || !Number.isInteger(Number(actual.anio))) throw new Error('Temporada no disponible');
    } catch (error) {
      console.error('[F1_APP] No se pudo determinar la temporada de la categoría',idCategoria,error);
      for(const id of ['gridGPs','gridWDC','gridWCC']) {
        message($(id),'No se pudo consultar la temporada de esta categoría. '+error.message,true);
        const diag=document.createElement('a');
        diag.href='/diagnostico';
        diag.textContent='Abrir diagnóstico de rutas y despliegues';
        diag.className='inline-block mt-2 underline text-red-300';
        $(id)?.append(diag);
      }
      const badge=$('anio');if(badge)badge.textContent='—';
      return;
    }
    currentYear=Number(actual.anio);
    $('anio').textContent=String(currentYear);
    const live=document.querySelector('.f1-live-chip');
    if(live)live.textContent=currentYear+' / F1';
    const paths=[
      '/api/granPremio/obtenerGPTemporada/'+idCategoria+'/'+currentYear,
      '/api/granPremio/obtenerWDCPorAnio/'+idCategoria+'/'+currentYear,
      '/api/granPremio/obtenerWCCPorAnio/'+idCategoria+'/'+currentYear
    ];
    const outcomes=await Promise.allSettled(paths.map((path,index)=>
      index === 0 && actual.__calendar ? Promise.resolve(actual.__calendar) : getJSON(path)));
    const [g,d,c]=outcomes;
    if(g.status==='fulfilled'){
      try{const gps=list(g.value,'grandes premios');renderGPs(gps);renderNextGP(gps);}
      catch(e){console.error(e);errorIn('gridGPs','el calendario');}
    }else {console.error(g.reason);errorIn('gridGPs','el calendario');}
    if(d.status==='fulfilled'){
      try{renderStandings(list(d.value,'pilotos'),'driver');}
      catch(e){console.error(e);errorIn('gridWDC','los pilotos');}
    }else {console.error(d.reason);errorIn('gridWDC','los pilotos');}
    if(c.status==='fulfilled'){
      try{renderStandings(list(c.value,'equipos'),'team');}
      catch(e){console.error(e);errorIn('gridWCC','los constructores');}
    }else {console.error(c.reason);errorIn('gridWCC','los constructores');}
  }
  window.addEventListener('DOMContentLoaded',start,{once:true});
})();
  </script>
</body>
</html>
